name: differentiate-agent
description: |
  Strategic differentiation workflow for agents with high catalogue overlap.
  
  Analyzes specific trait conflicts, proposes differentiation strategies,
  and applies user-selected strategy to carve a unique niche.

version: "1.0"

context:
  # Required: content and overlapping agent IDs
  content: ""                      # Current AGENTS.md to refine
  overlapping_agent_ids: []        # UUIDs of agents with high similarity
  
  # Optional
  attempt_number: 1                # For tracking if user re-runs
  previous_similarity: null        # Previous max similarity score

stages:
  # ========================================================================
  # Stage 1: Strategic Analysis
  # ========================================================================
  - name: analyze-and-propose
    agent: differentiator
    instruction: |
      Analyze overlap and propose differentiation strategies.
      
      **Current agent to refine:**
      ```
      {{content}}
      ```
      
      **Overlapping agents** (IDs to read with get_agent_content):
      {% for agent_id in overlapping_agent_ids %}
      - {{agent_id}}
      {% endfor %}
      
      **Your task:**
      1. Use get_agent_content to read FULL definitions of each overlapping agent
      2. Identify WHICH specific traits overlap (capabilities, domains, tools)
      3. Identify positioning gaps in the catalogue
      4. Apply your differentiation frameworks
      5. Propose 2-3 strategies with clear reasoning and trade-offs
      
      **Output format**: Return JSON only (no markdown):
      ```json
      {
        "overlap_analysis": {
          "shared_capabilities": ["cap1", "cap2"],
          "shared_domains": ["domain1"],
          "shared_tools": ["tool1"],
          "positioning_gaps": ["gap1", "gap2"],
          "competitive_landscape": "summary"
        },
        "strategies": [
          {
            "approach": "narrow_scope",
            "title": "Specialize in X",
            "reasoning": "Why this works...",
            "changes": "Remove A, B. Focus on C...",
            "expected_outcome": "Reduces overlap from X% to ~Y%",
            "trade_offs": "Narrower scope but clearer positioning"
          }
        ],
        "recommended_index": 0
      }
      ```

  # ========================================================================
  # Stage 2: User Selects Strategy (APPROVAL GATE)
  # ========================================================================
  - name: choose-strategy
    approval_required: true
    instruction: |
      # Select Differentiation Strategy
      
      {% if attempt_number > 1 %}
      **Progress so far**: Attempt {{attempt_number}}
      {% if previous_similarity %}Previous similarity: {{previous_similarity}}%{% endif %}
      {% endif %}
      
      ## Overlap Analysis
      
      {{analyze-and-propose.output.overlap_analysis.competitive_landscape}}
      
      **Conflicts**:
      - Capabilities: {{analyze-and-propose.output.overlap_analysis.shared_capabilities | join(', ')}}
      - Domains: {{analyze-and-propose.output.overlap_analysis.shared_domains | join(', ')}}
      
      **Positioning gaps**: {{analyze-and-propose.output.overlap_analysis.positioning_gaps | join(', ')}}
      
      ---
      
      ## Proposed Strategies
      
      {% for strategy in analyze-and-propose.output.strategies %}
      ### {{loop.index}}. {{strategy.title}}
      
      **Approach**: `{{strategy.approach}}`  
      **What changes**: {{strategy.changes}}  
      **Expected outcome**: {{strategy.expected_outcome}}  
      **Trade-offs**: {{strategy.trade_offs}}  
      
      **Reasoning**: {{strategy.reasoning}}
      
      {% if loop.index0 == analyze-and-propose.output.recommended_index %}⭐ **Recommended**{% endif %}
      
      ---
      {% endfor %}
      
      ## Your Choice
      
      Options:
      - `1`, `2`, or `3` - Apply that strategy
      - `recommended` - Use recommended strategy ({{analyze-and-propose.output.recommended_index + 1}})
      - `accept` - Accept current overlap, skip refinement
      - `cancel` - Cancel and return to upload flow
      
      Enter your choice:

  # ========================================================================
  # Stage 3: Apply Selected Strategy
  # ========================================================================
  - name: apply-differentiation
    agent: differentiator
    skip_if: "{{choose-strategy.user_input in ['accept', 'cancel']}}"
    instruction: |
      Apply the chosen differentiation strategy.
      
      <current_content>
      {{content}}
      </current_content>
      
      <chosen_strategy>
      {% set choice = choose-strategy.user_input %}
      {% if choice == 'recommended' %}
      {% set idx = analyze-and-propose.output.recommended_index %}
      {% else %}
      {% set idx = choice | int - 1 %}
      {% endif %}
      {{analyze-and-propose.output.strategies[idx] | tojson}}
      </chosen_strategy>
      
      <overlap_context>
      Shared capabilities: {{analyze-and-propose.output.overlap_analysis.shared_capabilities | join(', ')}}
      Shared domains: {{analyze-and-propose.output.overlap_analysis.shared_domains | join(', ')}}
      </overlap_context>
      
      **Instructions**:
      1. Parse the current agent definition
      2. Apply the strategy changes precisely:
         - If narrow_scope: REMOVE listed capabilities, deepen focus area
         - If different_method: REFRAME approach while keeping problem domain
         - If adjacent_niche: SHIFT to related but distinct use case
         - If unique_combo: EMPHASIZE unique capability intersection
         - If different_audience: SPECIALIZE for user segment
      3. Add explicit "Not for" and "Defers to" statements referencing overlapping agents
      4. Preserve agent name and core mission
      5. Keep under 1500 tokens
      
      **Output**: ONLY the refined AGENTS.md markdown. No preamble, no code fences, no explanation.
      
      Start directly with # heading.

# Final output is the refined content from apply-differentiation stage
output: "{{apply-differentiation.output if choose-strategy.user_input not in ['accept', 'cancel'] else content}}"
