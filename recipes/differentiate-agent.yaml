name: differentiate-agent
description: |
  Strategic differentiation workflow for agents with high catalogue overlap.
  
  Analyzes trait conflicts, proposes strategies, and applies the recommended
  one after user approval checkpoint.
  
  NOTE: Recipe approval gates support approve/deny only. For multi-choice
  strategy selection, use the /api/refine endpoint instead.

version: "1.0.0"

context:
  content: ""                      # Required: Current AGENTS.md to refine
  overlapping_agent_ids: []        # Required: UUIDs of overlapping agents
  
  # Optional tracking
  attempt_number: 1
  previous_similarity: null

stages:
  # ========================================================================
  # Stage 1: Strategic Analysis
  # ========================================================================
  - name: strategic-analysis
    steps:
      - id: analyze-overlap
        agent: differentiator
        prompt: |
          Analyze overlap and propose differentiation strategies.
          
          **Current agent to refine:**
          ```
          {{content}}
          ```
          
          **Overlapping agents** (use get_agent_content to read these):
          {% for agent_id in overlapping_agent_ids %}
          - {{agent_id}}
          {% endfor %}
          
          **Your task:**
          1. Use get_agent_content tool to read FULL definitions of each overlapping agent
          2. Identify WHICH specific traits overlap (capabilities, domains, tools)
          3. Identify positioning gaps in the catalogue
          4. Apply your differentiation frameworks (narrow scope, different method, etc.)
          5. Propose 2-3 strategies with clear reasoning
          6. Recommend the best strategy
          
          **Output format**: Return JSON only:
          ```json
          {
            "overlap_analysis": {
              "shared_capabilities": ["cap1", "cap2"],
              "shared_domains": ["domain1"],
              "shared_tools": ["tool1"],
              "positioning_gaps": ["gap1", "gap2"],
              "summary": "High-level competitive landscape"
            },
            "strategies": [
              {
                "approach": "narrow_scope",
                "title": "Specialize in X",
                "reasoning": "Why this differentiates...",
                "changes": "Remove A, B. Focus on C...",
                "expected_outcome": "Reduces overlap from X% to ~Y%",
                "trade_offs": "Narrower scope but clearer value"
              }
            ],
            "recommended_index": 0,
            "recommended_reasoning": "Why this is best choice..."
          }
          ```
        parse_json: true
        output: analysis
      
      - id: format-for-approval
        agent: differentiator
        prompt: |
          Format this strategic analysis for user review:
          
          {{analysis | tojson}}
          
          Create a clear, readable summary showing:
          1. Overlap conflicts (bullet list)
          2. Each proposed strategy with pros/cons
          3. Recommended strategy highlighted
          
          Output markdown for display.
        output: formatted_analysis
    
    approval:
      required: true
      prompt: |
        # Differentiation Strategies
        
        {{formatted_analysis}}
        
        ---
        
        **Approve** to apply the recommended strategy.
        **Deny** to cancel differentiation and keep current version.
      timeout: 0  # No timeout - wait indefinitely for user
      default: deny

  # ========================================================================
  # Stage 2: Apply Recommended Strategy
  # ========================================================================
  - name: strategy-application
    steps:
      - id: apply-recommended-strategy
        agent: differentiator
        prompt: |
          Apply the recommended differentiation strategy.
          
          <current_content>
          {{content}}
          </current_content>
          
          <overlap_analysis>
          Shared capabilities: {{analysis.overlap_analysis.shared_capabilities | join(', ')}}
          Shared domains: {{analysis.overlap_analysis.shared_domains | join(', ')}}
          Positioning gaps: {{analysis.overlap_analysis.positioning_gaps | join(', ')}}
          </overlap_analysis>
          
          <chosen_strategy>
          {% set idx = analysis.recommended_index %}
          Title: {{analysis.strategies[idx].title}}
          Approach: {{analysis.strategies[idx].approach}}
          Changes: {{analysis.strategies[idx].changes}}
          Expected outcome: {{analysis.strategies[idx].expected_outcome}}
          Reasoning: {{analysis.strategies[idx].reasoning}}
          </chosen_strategy>
          
          **Instructions**:
          1. Apply the strategy changes precisely
          2. Add explicit "Not for" and "Defers to" sections
          3. Remove or reframe overlapping capabilities
          4. Emphasize unique positioning
          5. Keep under 1500 tokens
          
          **Output**: ONLY the refined AGENTS.md markdown. No preamble, no code fences.
          Start with # heading.
        output: refined_content
