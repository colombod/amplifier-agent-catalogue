[project]
name = "amplifier-agent-catalogue"
version = "0.1.0"
description = "A web application for cataloguing, versioning, and discovering AGENTS.md files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    # Azure OpenAI / AI Services
    "openai>=1.12.0",
    "azure-identity>=1.15.0",
    # Amplifier
    "amplifier-core",
    # Storage
    "duckdb>=0.10.0",
    # Data processing
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    # Markdown parsing
    "markdown-it-py>=3.0.0",
    # Utilities
    "rich>=13.7.0",
    "httpx>=0.26.0",
    "tiktoken>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
]

[project.scripts]
agent-catalogue = "agent_catalogue.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_catalogue"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest-playwright>=0.7.2",
    "requests>=2.32.5",
    "ruff>=0.15.0",
]