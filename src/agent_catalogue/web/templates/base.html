<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agent Catalogue{% endblock %}</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg-secondary: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --success: #3fb950;
            --warning: #d29922;
            --danger: #f85149;
        }
        
        .hidden { display: none !important; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }
        
        a {
            color: var(--accent);
            text-decoration: none;
        }
        
        a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
        }
        
        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }
        
        nav {
            display: flex;
            gap: 1.5rem;
        }
        
        nav a {
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        
        nav a:hover {
            color: var(--text);
        }
        
        /* Main content */
        main {
            padding: 2rem 0;
        }
        
        h1, h2, h3 {
            color: var(--text);
            margin-bottom: 1rem;
        }
        
        h1 { font-size: 1.75rem; }
        h2 { font-size: 1.5rem; }
        h3 { font-size: 1.25rem; }
        
        /* Cards */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .card-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        
        /* Tags */
        .tag {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent);
            border-radius: 999px;
            font-size: 0.75rem;
            margin-right: 0.25rem;
            margin-bottom: 0.25rem;
        }
        
        .tag-domain {
            background: rgba(63, 185, 80, 0.15);
            color: var(--success);
        }
        
        .tag-tool {
            background: rgba(210, 153, 34, 0.15);
            color: var(--warning);
        }
        
        /* Buttons */
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text);
            transition: all 0.15s ease;
        }
        
        .btn:hover {
            background: var(--border);
            text-decoration: none;
        }
        
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        
        .btn-secondary {
            background: transparent;
            border-color: var(--border);
            color: var(--text-muted);
        }
        
        .btn-secondary:hover {
            background: var(--bg-secondary);
            color: var(--text);
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        
        /* Forms */
        input, textarea, select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.875rem;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }
        
        label {
            display: block;
            margin-bottom: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        /* Grid */
        .grid {
            display: grid;
            gap: 1rem;
        }
        
        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        
        /* Utilities */
        .text-muted { color: var(--text-muted); }
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }
        .text-danger { color: var(--danger); }
        .text-sm { font-size: 0.875rem; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        
        /* Alert */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
        
        .alert-error {
            background: rgba(248, 81, 73, 0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
        }
        
        .alert-success {
            background: rgba(63, 185, 80, 0.15);
            border: 1px solid var(--success);
            color: var(--success);
        }
        
        /* Score bar */
        .score-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .score-bar-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        
        /* Code/pre */
        pre, code {
            font-family: 'Consolas', 'Monaco', monospace;
            background: var(--bg);
            border-radius: 4px;
        }
        
        code {
            padding: 0.125rem 0.375rem;
            font-size: 0.875rem;
        }
        
        pre {
            padding: 1rem;
            overflow-x: auto;
            border: 1px solid var(--border);
        }
        
        pre code {
            padding: 0;
            background: none;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">Agent Catalogue</a>
            <nav>
                <a href="/">Browse</a>
                <a href="/search">Search</a>
                <a href="/upload">Upload</a>
            </nav>
        </div>
    </header>
    
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
