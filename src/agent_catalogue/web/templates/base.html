<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agent Catalogue{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    {% block extra_head %}{% endblock %}
</head>

<body>
    <header>
        <div class="container">
            <a href="/" class="logo">Agent Catalogue</a>
            <nav>
                <a href="/">Browse</a>
                <a href="/search">Search</a>
                <a href="/upload">Upload</a>
                <a href="https://github.com/microsoft/amplifier" target="_blank" rel="noopener" class="powered-by">
                    <span>Powered by</span>
                    <img src="https://avatars.githubusercontent.com/u/240397093?s=40" alt="Amplifier">
                    <strong>Amplifier</strong>
                </a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>

</html>
