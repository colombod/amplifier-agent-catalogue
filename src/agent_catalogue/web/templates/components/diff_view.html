{# Diff-like comparison view component for behavioral analysis #}
{# Include with: {% include "components/diff_view.html" %} #}

<style>
/* ==========================================================================
   DIFF VIEW STYLES - Code diff inspired agent comparison
   ========================================================================== */

.diff-container {
    font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg);
}

/* Header with verdict */
.diff-header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    padding: 1rem 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.diff-header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.diff-verdict {
    padding: 0.25rem 0.75rem;
    border-radius: 4px;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.verdict-duplicate { background: #f85149; }
.verdict-overlapping { background: #d29922; }
.verdict-distinct { background: #3fb950; }

.diff-score {
    font-size: 24px;
    font-weight: 700;
}

.diff-agents {
    color: rgba(255,255,255,0.8);
    font-family: system-ui, sans-serif;
    font-size: 14px;
}

/* Three-column diff layout */
.diff-body {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    min-height: 150px;
}

/* Column headers */
.diff-column-header {
    padding: 0.75rem 1rem;
    font-weight: 600;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
}

.diff-col-a .diff-column-header {
    background: rgba(88, 166, 255, 0.1);
    color: #58a6ff;
    border-right: 1px solid var(--border);
}

.diff-col-shared .diff-column-header {
    background: rgba(63, 185, 80, 0.1);
    color: #3fb950;
}

.diff-col-b .diff-column-header {
    background: rgba(248, 81, 73, 0.1);
    color: #f85149;
    border-left: 1px solid var(--border);
}

/* Column content */
.diff-col-a,
.diff-col-shared,
.diff-col-b {
    display: flex;
    flex-direction: column;
}

.diff-col-a { background: rgba(88, 166, 255, 0.03); }
.diff-col-shared { background: rgba(63, 185, 80, 0.03); }
.diff-col-b { background: rgba(248, 81, 73, 0.03); }

.diff-content {
    padding: 0.5rem;
    flex: 1;
}

/* Diff items */
.diff-item {
    padding: 0.5rem 0.75rem;
    margin: 0.25rem 0;
    border-radius: 4px;
    position: relative;
}

.diff-item-a {
    background: rgba(88, 166, 255, 0.1);
    border-left: 3px solid #58a6ff;
}

.diff-item-shared {
    background: rgba(63, 185, 80, 0.1);
    border-left: 3px solid #3fb950;
}

.diff-item-b {
    background: rgba(248, 81, 73, 0.1);
    border-left: 3px solid #f85149;
}

/* Line number style prefix */
.diff-item-a::before { content: "+"; color: #58a6ff; margin-right: 0.5rem; font-weight: 500; }
.diff-item-shared::before { content: "="; color: #3fb950; margin-right: 0.5rem; font-weight: 500; }
.diff-item-b::before { content: "−"; color: #f85149; margin-right: 0.5rem; font-weight: 500; }

/* Behavioral diff section */
.diff-behavioral {
    border-top: 1px solid var(--border);
    padding: 1rem;
    background: var(--bg-secondary);
}

.diff-behavioral-title {
    font-family: system-ui, sans-serif;
    font-weight: 600;
    font-size: 12px;
    margin-bottom: 0.75rem;
    color: var(--text);
}

.diff-behavioral-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

.diff-behavioral-item {
    padding: 0.75rem;
    background: var(--bg);
    border-radius: 6px;
    border: 1px solid var(--border);
}

.diff-behavioral-label {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
}

.diff-behavioral-value {
    font-family: system-ui, sans-serif;
    font-size: 13px;
}

.diff-behavioral-value.agent-a { color: #58a6ff; }
.diff-behavioral-value.agent-b { color: #f85149; }

/* Recommendation box */
.diff-recommendation {
    padding: 1.25rem;
    border-top: 2px solid var(--border);
    font-family: system-ui, sans-serif;
}

.rec-action {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-weight: 600;
    margin-bottom: 0.75rem;
}

.rec-reject { background: rgba(248, 81, 73, 0.15); color: #f85149; }
.rec-merge { background: rgba(163, 113, 247, 0.15); color: #a371f7; }
.rec-keep_both { background: rgba(63, 185, 80, 0.15); color: #3fb950; }
.rec-replace { background: rgba(210, 153, 34, 0.15); color: #d29922; }

.rec-reasoning {
    color: var(--text);
    line-height: 1.6;
    font-size: 14px;
}

/* Narrative section */
.diff-narrative {
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--border);
    background: var(--bg-secondary);
    font-family: system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
}

.diff-narrative-title {
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
}

/* Empty state */
.diff-empty {
    padding: 1rem;
    text-align: center;
    color: var(--text-muted);
    font-family: system-ui, sans-serif;
    font-size: 12px;
}
</style>

<script type="module">
import { escapeHtml } from '/static/js/utils.js';

/**
 * Render a behavioral diff comparison
 * @param {Object} comparison - Comparison object from API
 * @param {string} containerId - DOM element ID to render into
 * @param {string} existingName - Name of existing agent
 * @param {string} newName - Name of new agent
 * @param {string} narrative - Human-readable narrative
 */
window.renderBehavioralDiff = function(comparison, containerId, existingName, newName, narrative) {
    const container = document.getElementById(containerId);
    if (!container || !comparison) {
        if (container) {
            container.innerHTML = '<div class="diff-empty">No comparison data available</div>';
        }
        return;
    }
    
    const verdict = comparison.verdict || 'unknown';
    const verdictClass = `verdict-${verdict}`;
    const score = comparison.similarity_score || 0;
    const scorePercent = Math.round(score * 100);
    
    // Get capability diff
    const capDiff = comparison.capability_diff || {};
    const shared = capDiff.shared || [];
    const uniqueA = capDiff.unique_to_a || [];
    const uniqueB = capDiff.unique_to_b || [];
    
    // Get behavioral diff
    const behDiff = comparison.behavioral_diff || {};
    
    // Get recommendation
    const rec = comparison.recommendation || {};
    const recAction = rec.action || 'keep_both';
    const recClass = `rec-${recAction}`;
    const recReasoning = rec.reasoning || '';
    
    container.innerHTML = `
        <div class="diff-container">
            <!-- Header -->
            <div class="diff-header">
                <div class="diff-header-left">
                    <span class="diff-verdict ${verdictClass}">${verdict}</span>
                    <span class="diff-agents">${newName || 'New Agent'} vs ${existingName || 'Existing Agent'}</span>
                </div>
                <div class="diff-score">${scorePercent}%</div>
            </div>
            
            <!-- Capability Diff -->
            <div class="diff-body">
                <!-- New Agent Unique -->
                <div class="diff-col-a">
                    <div class="diff-column-header">
                        + ${newName || 'New'} Only
                    </div>
                    <div class="diff-content">
                        ${renderCapabilities(uniqueA, 'a')}
                    </div>
                </div>
                
                <!-- Shared -->
                <div class="diff-col-shared">
                    <div class="diff-column-header">
                        = Shared
                    </div>
                    <div class="diff-content">
                        ${renderCapabilities(shared, 'shared')}
                    </div>
                </div>
                
                <!-- Existing Agent Unique -->
                <div class="diff-col-b">
                    <div class="diff-column-header">
                        − ${existingName || 'Existing'} Only
                    </div>
                    <div class="diff-content">
                        ${renderCapabilities(uniqueB, 'b')}
                    </div>
                </div>
            </div>
            
            <!-- Behavioral Differences -->
            ${renderBehavioralDifferences(behDiff, newName, existingName)}
            
            <!-- Recommendation -->
            <div class="diff-recommendation">
                <div class="rec-action ${recClass}">
                    ${getRecIcon(recAction)}
                    ${recAction.replace('_', ' ').toUpperCase()}
                </div>
                <p class="rec-reasoning">${recReasoning}</p>
            </div>
            
            <!-- Narrative -->
            ${narrative ? `
                <div class="diff-narrative">
                    <div class="diff-narrative-title">Analysis</div>
                    ${narrative}
                </div>
            ` : ''}
        </div>
    `;
}

function renderCapabilities(items, type) {
    if (!items || items.length === 0) {
        return '<div class="diff-empty">None</div>';
    }
    return items.map(item => {
        // Handle both string items and object items
        let displayText = item;
        if (typeof item === 'object' && item !== null) {
            // If it's an object, try to extract meaningful text
            displayText = item.name || item.capability || item.description || JSON.stringify(item);
        }
        return `<div class="diff-item diff-item-${type}">${escapeHtml(displayText)}</div>`;
    }).join('');
}

function renderBehavioralDifferences(behDiff, newName, existingName) {
    if (!behDiff || Object.keys(behDiff).length === 0) {
        return '';
    }
    
    const items = Object.entries(behDiff).map(([key, value]) => {
        if (typeof value === 'object' && value !== null) {
            // Try multiple field names that LLM might use
            const agentA = value.agent_a || value.new_agent || value[newName] || value.a || '';
            const agentB = value.agent_b || value.existing_agent || value[existingName] || value.b || '';
            
            // Convert to string if still an object
            const textA = typeof agentA === 'object' ? JSON.stringify(agentA) : agentA;
            const textB = typeof agentB === 'object' ? JSON.stringify(agentB) : agentB;
            
            return `
                <div class="diff-behavioral-item">
                    <div class="diff-behavioral-label">${formatLabel(key)}</div>
                    <div class="diff-behavioral-value agent-a">+ ${newName}: ${escapeHtml(textA)}</div>
                    <div class="diff-behavioral-value agent-b">− ${existingName}: ${escapeHtml(textB)}</div>
                </div>
            `;
        }
        return '';
    }).filter(Boolean).join('');
    
    if (!items) return '';
    
    return `
        <div class="diff-behavioral">
            <div class="diff-behavioral-title">Behavioral Differences</div>
            <div class="diff-behavioral-grid">
                ${items}
            </div>
        </div>
    `;
}

function formatLabel(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function getRecIcon(action) {
    const icons = {
        'reject': '✕',
        'merge': '⊕',
        'keep_both': '✓✓',
        'replace': '↻'
    };
    return icons[action] || '•';
}
</script>
